[project]
name = "python-libghostty-vt"
version = "0.1.0.dev0"
description = "Idiomatic, fully typed Python bindings for libghostty-vt, the C-ABI terminal library extracted from Ghostty."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rayan Sóstenes" }]
keywords = ["terminal", "vt", "ghostty", "emulator", "ansi", "escape-sequences"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Typing :: Typed",
]
dependencies = ["cffi>=1.17"]

[project.urls]
Homepage = "https://github.com/rayancocos/python-libghostty-vt"
Repository = "https://github.com/rayancocos/python-libghostty-vt"
Issues = "https://github.com/rayancocos/python-libghostty-vt/issues"

[build-system]
# ziglang builds the static libghostty-vt from the vendored source at wheel
# time; cffi generates and compiles the raw-layer extension against it.
requires = ["setuptools>=77", "cffi>=1.17", "ziglang==0.15.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# _cdef.h is the generated raw-layer cdef; it must ship in the sdist so a
# wheel build can regenerate the extension from it without the cdef generator.
ghostty_vt = ["py.typed", "_raw.pyi", "_cdef.h"]

[dependency-groups]
dev = [
    # Pinned zig toolchain: tracks upstream's minimum (ghostty build.zig.zon).
    # This is the single source of truth for the zig version.
    "ziglang==0.15.2",
    "ruff>=0.14",
    "pytest>=8.4",
    "pytest-cov>=5.0",
    # Strict type checkers gating the idiomatic layer and tests in PR CI. The
    # broader five-checker typesafety suite (scripts/typesafety.py) reuses this
    # pinned mypy/pyright and adds basedpyright, ty, and pyrefly at latest.
    # types-cffi supplies the cffi stubs so the raw-layer build shim
    # (_cffi_build.py) type-checks strictly instead of being excluded. The
    # pyright nodejs extra bundles the node runtime as a PyPI wheel (cached by
    # uv), so CI never re-downloads it from nodejs.org.
    "mypy>=1.15",
    "types-cffi>=1.17",
    "pyright[nodejs]>=1.1.390",
    # Build backend, present in the dev env so `just build` can compile the
    # raw-layer extension in place without build isolation.
    "setuptools>=77",
    "cffi>=1.17",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]
# The typesafety suite is never executed and holds deliberate misuse (bare
# expressions, wrong-typed calls) that only the type checkers should judge;
# linting or reformatting it would fight its purpose.
extend-exclude = ["typesafety"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["ghostty_vt"]

[tool.mypy]
# Strict over the full source tree and the tests, including the raw-layer cffi
# build shim (_cffi_build.py) — its C boundary is typed via the types-cffi
# stubs. The _raw extension is typed by its hand-written _raw.pyi stub. `tools`
# is on the path (not in `files`) so the generator tests resolve `gen_cdef`
# without strict-checking the build-time tooling itself.
strict = true
mypy_path = ["src", "tools"]
explicit_package_bases = true
files = ["src", "tests"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests"]
# `tools` is a resolution path (not in `include`) so the generator tests can
# import `gen_cdef` without strict-checking the build-time tooling itself.
extraPaths = ["src", "tools"]
# The raw layer is a generated extension typed entirely by its _raw.pyi stub; a
# compiled module only exists after a build, and its presence must not change
# type-check results. Treat the stub as the authoritative type source.
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The cdef generator is build-time tooling outside the shipped package; put it on
# the path so its tests can import it without installing it.
pythonpath = ["tools"]
addopts = [
    "-ra",
    "--cov=ghostty_vt",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["ghostty_vt"]
# The generated cffi raw layer and its build script are the C boundary, not
# Python behavior under test; the spec scopes coverage to the Python source.
omit = [
    "*/ghostty_vt/_cffi_build.py",
    "*/ghostty_vt/_raw.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = ["if TYPE_CHECKING:"]

[tool.cibuildwheel]
# CPython 3.14 GIL builds only: cffi API mode targets a specific interpreter, so
# no abi3 and no free-threaded (cp314t) wheels (per the v0.1 spec).
build = "cp314-*"
# pypa/build honors build-system.requires, so the pinned `ziglang` toolchain is
# provisioned inside every build environment (including the manylinux/musllinux
# containers) and the static-lib build in _cffi_build.py runs hermetically
# against the vendored source and zig package cache copied in with the project.
build-frontend = "build"
# Verify every built wheel by installing it and running the suite against it, as
# a user would. Coverage enforcement is a PR-CI concern, not a wheel concern, so
# the project's --cov addopts are cleared here.
test-requires = "pytest"
test-command = "pytest {project}/tests -o addopts="
