name: CI

# Every pull request and every push to main gets a red/green verdict.
on:
  pull_request:
  push:
    branches: [main]

# Supersede in-flight runs for the same PR branch; the latest commit is the only
# one whose verdict matters. Runs on main are never cancelled, so every commit to
# the release-gating branch records its own completed verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint / format
    runs-on: ubuntu-latest
    # Pure static analysis of the source tree — ruff never imports the package,
    # so this needs neither the vendored upstream nor the built extension. Its
    # verdict is platform-independent, so a single OS suffices.
    env:
      # `uv run` inside the recipes must not sync (and thus build) the project;
      # the `uv sync --no-install-project` step below installs only the tools.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with Python 3.14)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      # Install the dev tools (ruff, ...) without building the project itself:
      # the raw-layer extension requires `just vendor` + a zig build, and lint
      # does not need it.
      - name: Install tooling (no project build)
        run: uv sync --no-install-project

      - name: Lint (ruff)
        run: just lint

      - name: Format check (ruff)
        run: just fmt-check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    # mypy and pyright read the source tree directly; the raw layer is typed by
    # its hand-written _raw.pyi stub, the authoritative type source, so the
    # compiled extension is not required (pyright's reportMissingModuleSource is
    # off precisely so the stub stands in for the unbuilt module). No vendor, no
    # build, single OS — the strict verdict is platform-independent.
    env:
      # `uv run` inside the recipe must not sync (and thus build) the project;
      # the `uv sync --no-install-project` step below installs only the checkers.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with Python 3.14)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      # Install mypy/pyright (and their stubs) without building the project: the
      # extension is typed by _raw.pyi, so no vendored source or zig build.
      - name: Install tooling (no project build)
        run: uv sync --no-install-project

      - name: Type-check (mypy + pyright, strict)
        run: just typecheck

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms' verdicts even when one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # zig 0.15.2's Mach-O linker cannot match the arm64e-macos TBD entries the
    # macOS 26.4+ SDK introduced, so linking the static libghostty-vt fails with
    # "undefined symbol: __availability_version_check" (and _abort, _dispatch_*,
    # ...). See ziglang/zig#31658; the fix (#31673) is not in released 0.15.2.
    # The runner defaults to that SDK, so point the toolchain at Xcode 26.3,
    # whose SDK predates the change. Empty (and unused) on the Linux matrix leg.
    env:
      DEVELOPER_DIR: ${{ matrix.os == 'macos-latest' && '/Applications/Xcode_26.3.app/Contents/Developer' || '' }}
    steps:
      - uses: actions/checkout@v4

      # uv provisions Python 3.14 and, via the ziglang dev dependency, the
      # pinned zig toolchain used to build the static libghostty-vt.
      - name: Install uv (with Python 3.14)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      # --- Build-artifact caching -------------------------------------------
      # The zig global cache holds the fetched zig packages (p/) and zig's
      # content-addressed compiled objects (o/), so a warm run re-fetches
      # nothing and recompiles little when `just vendor` builds the host static
      # lib into vendor/dist. Keyed on every input that changes the produced
      # lib, so a bump forces a cold, correct rebuild:
      #   - ghostty-commit.txt            the pinned upstream source
      #   - scripts/_lib.sh               the zig build options + ZIG_OPTIMIZE default
      #   - src/ghostty_vt/_cffi_build.py the wheel-time build's copy of those options
      #   - pyproject.toml                the pinned `ziglang` toolchain version
      #   - runner.os / runner.arch       the build target
      #   - env.DEVELOPER_DIR             the macOS SDK/Xcode the zig link uses
      #   - env.ZIG_OPTIMIZE              the effective optimize mode (default
      #                                   ReleaseFast); an env override changes
      #                                   the produced lib, so it is keyed on
      #                                   directly, not just via _lib.sh's default
      # uv.lock is deliberately not keyed on: it churns on unrelated dep bumps,
      # and the ziglang version is already pinned exactly in pyproject.toml. The
      # cffi/setuptools output (the small C-to-.so compile in build/) is also not
      # cached: it is cheap next to the zig build, and a cached .so is fragile
      # across Python ABIs, so warm runs recompile only that thin layer. The
      # cache is a pure optimization: on a miss the build compiles from scratch
      # and the cache is then populated.
      - name: Cache the zig global cache
        uses: actions/cache@v4
        with:
          path: vendor/zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVELOPER_DIR }}-${{ env.ZIG_OPTIMIZE || 'ReleaseFast' }}-${{ hashFiles('ghostty-commit.txt', 'scripts/_lib.sh', 'src/ghostty_vt/_cffi_build.py', 'pyproject.toml') }}

      # Vendor the libghostty-vt-only source at the pinned commit; the host
      # build inside populates the zig package cache and leaves the static lib
      # in vendor/dist, so `just build` skips the zig compile.
      - name: Vendor upstream source at the pinned commit
        run: just vendor

      - name: Build the raw-layer extension
        run: just build

      - name: Tests with 100% coverage gate
        run: just test

  typesafety:
    name: typesafety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with Python 3.14)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      # Same zig global cache as the `test` job (see the rationale and
      # invalidation keys there). Shares the ubuntu cache entries with `test`.
      - name: Cache the zig global cache
        uses: actions/cache@v4
        with:
          path: vendor/zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVELOPER_DIR }}-${{ env.ZIG_OPTIMIZE || 'ReleaseFast' }}-${{ hashFiles('ghostty-commit.txt', 'scripts/_lib.sh', 'src/ghostty_vt/_cffi_build.py', 'pyproject.toml') }}

      # Vendor + build so `pyright --verifytypes` can resolve the installed
      # package; the recipe's `build` dependency compiles the extension against
      # the static lib the vendoring host build left in vendor/dist.
      - name: Vendor upstream source at the pinned commit
        run: just vendor

      # Runs all five checkers (mypy, pyright, basedpyright, ty, pyrefly) plus
      # the Pylance-bundled pyright over the suite, and the verifytypes gate. The
      # checkers are resolved at latest stable by uv at run time, so a checker
      # release can turn this red without a code change (accepted per the spec).
      - name: Typesafety suite
        run: just typesafety
